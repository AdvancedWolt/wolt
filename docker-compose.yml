services:

  cpp-service:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["8080"]
    ports:
      - "8080:8080"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    environment:
      PORT: 3000
      CPP_SERVICE_HOST: cpp-service
      CPP_SERVICE_PORT: 8080
    ports:
      - "3000:3000"
    depends_on:
      - cpp-service

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    environment:
      - VITE_API_URL=http://localhost:3000
    ports:
      - "5173:5173"
    depends_on:
      - web


# usage:
# build: docker compose build
# run: docker compose up
# build and run in one command: docker compose up --build
