services:

  cpp-service:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["8080"]
    ports:
      - "8080:8080"

  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    environment:
      PORT: 3000
      CPP_SERVICE_HOST: cpp-service
      CPP_SERVICE_PORT: 8080
      MONGO_URI: mongodb://mongo:27017/wolt
    ports:
      - "3000:3000"
    depends_on:
      - cpp-service
      - mongo

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    environment:
      - VITE_API_URL=http://web:3000
    ports:
      - "5173:5173"
    depends_on:
      - web

volumes:
  # Named volume keeps MongoDB data across container restarts.
  mongo-data:

# usage:
# build: docker compose build
# run: docker compose up
# build and run in one command: docker compose up --build
